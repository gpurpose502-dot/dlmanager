name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Draw app icon
        run: swift make_icon.swift Sources/Assets.xcassets/AppIcon.appiconset/icon.png
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project DLManager.xcodeproj -scheme DLManager \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DLManager.app Payload/
          zip -qr DLManager.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DLManager-ipa
          path: DLManager.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" DLManager.ipa --title "Build ${{ github.run_number }}" --notes "Unsigned IPA. Sign it before installing."
